services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Required at build time: Next.js inlines NEXT_PUBLIC_* into the JS bundle.
        # Set these in a .env file next to this compose file, or export in your shell.
        - NEXT_PUBLIC_CONVEX_URL=${NEXT_PUBLIC_CONVEX_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
        - NEXT_PUBLIC_CONVEX_SITE_URL=${NEXT_PUBLIC_CONVEX_SITE_URL:-}
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    # env_file:
    #   - .env.production
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # One-off service to deploy Convex functions to the PRODUCTION deployment.
  # Requires: CONVEX_DEPLOY_KEY (production deploy key from the Convex dashboard)
  # Usage: docker compose --profile setup run --rm deploy-convex-prod
  deploy-convex-prod:
    image: oven/bun:1.3.10-alpine@sha256:32f1fcccb1523960b254c4f80973bee1a910d60be000a45c20c9129a1efcffee
    working_dir: /app
    volumes:
      - ./convex:/app/convex:ro
      - ./package.json:/app/package.json:ro
      - ./bun.lock:/app/bun.lock:ro
    environment:
      - CONVEX_DEPLOY_KEY=${CONVEX_DEPLOY_KEY}
    command:
      [
        "sh",
        "-c",
        "bun install --frozen-lockfile --ignore-scripts && bunx convex deploy",
      ]
    profiles:
      - setup
